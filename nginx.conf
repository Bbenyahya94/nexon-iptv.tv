server { listen 80; server_name www.nexon-iptv.tv; return 301 https://nexon-iptv.tv$request_uri; }
server { listen 80; server_name nexon-iptv.tv _; root /usr/share/nginx/html; index index.html; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header X-Content-Type-Options "nosniff" always; error_page 404 /404.html; location = /404.html { internal; } location / { try_files $uri $uri/ $uri.html =404; } }
